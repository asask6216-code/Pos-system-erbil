
<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Al-Hout Pro Cashier | Ultimate POS</title>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#9333ea" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
      :root {
        --ai-purple: #9333ea;
        --ai-purple-light: #a855f7;
        --navy-dark: #0f172a;
        --navy-accent: #1e293b;
      }
      body {
        font-family: 'Tajawal', 'Poppins', sans-serif;
        background: #000;
        color: #fff;
        user-select: none;
        overflow: hidden;
        height: 100vh;
        width: 100vw;
        -webkit-tap-highlight-color: transparent;
      }
      #loading-overlay {
        position: fixed;
        inset: 0;
        background: #000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 10000;
      }
      .spinner {
        width: 80px;
        height: 80px;
        border: 8px solid rgba(147, 51, 234, 0.1);
        border-top-color: #9333ea;
        border-radius: 50%;
        animation: spin 1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        margin-bottom: 30px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes spin-slow { to { transform: rotate(360deg); } }
      .animate-spin-slow { animation: spin-slow 8s linear infinite; }

      .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #333; border-radius: 30px; }
      
      .btn-touch {
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .btn-touch:active {
        transform: scale(0.94);
        opacity: 0.9;
      }
      
      @keyframes popIn {
        from { transform: scale(0.9); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
      }
      .animate-pop { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

      .sparkle-btn {
        background: linear-gradient(135deg, #9333ea 0%, #7c3aed 100%);
        box-shadow: 0 15px 45px rgba(147, 51, 234, 0.5);
      }
      
      .animate-fade {
        animation: fadeIn 0.4s ease-out forwards;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }

      input[type="number"]::-webkit-inner-spin-button,
      input[type="number"]::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.35.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0"
  }
}
</script>
</head>
  <body>
    <div id="loading-overlay">
      <div class="spinner"></div>
      <div style="font-family: Tajawal; font-weight: 900; font-size: 2rem; color: #9333ea; letter-spacing: -1px;">AL-HOUT PRO</div>
      <div style="font-family: Tajawal; font-weight: 500; font-size: 1rem; color: #666; margin-top: 10px;">PREMIUM CLOTHING SYSTEM v10.5</div>
    </div>
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
  </body>
</html>
